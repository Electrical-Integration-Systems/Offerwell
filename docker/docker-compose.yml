services:
  typesense:
    image: typesense/typesense:27.1
    container_name: typesense
    restart: unless-stopped
    ports:
      - "127.0.0.1:8108:8108"
    volumes:
      - ./typesense-data:/data
    environment:
      - TYPESENSE_API_KEY=${TYPESENSE_API_KEY:-super-secret-admin-key}
    command:
      - '--data-dir=/data'
      - '--enable-cors'

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ./ollama-data:/root/.ollama
    environment:
      - OLLAMA_ORIGINS="*"

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      # Interfața web va rula intern pe portul 3000
      - "127.0.0.1:3000:8080"
    environment:
      # Îi spunem UI-ului cum să comunice direct cu containerul Ollama prin rețeaua Docker
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      # Salvăm setările și conturile create în interfața web
      - ./open-webui-data:/app/backend/data
    depends_on:
      - ollama

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}