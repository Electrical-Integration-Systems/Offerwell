services:
  typesense:
    image: typesense/typesense:27.1
    container_name: typesense
    restart: unless-stopped
    ports:
      - "127.0.0.1:8108:8108"
    volumes:
      - ./typesense-data:/data
    environment:
      - TYPESENSE_API_KEY=${TYPESENSE_API_KEY:-super-secret-admin-key}
    command:
      - '--data-dir=/data'
      - '--enable-cors'

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ./ollama-data:/root/.ollama
    environment:
      - OLLAMA_ORIGINS="*"

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ./open-webui-data:/app/backend/data
    depends_on:
      - ollama

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}

  laya:
    image: python:3.12-slim
    container_name: laya
    restart: unless-stopped
    working_dir: /app

    ports:
      - "127.0.0.1:8081:8000"

    volumes:
      - ./laya-data:/root/.cache/huggingface

    environment:
      HF_HOME: /root/.cache/huggingface
      PYTHONUNBUFFERED: "1"
      USE_TF: "0"

      LAYA_SERVE_BACKEND: "laya"
      LAYA_SERVE_DEVICE: "cpu"
      LAYA_SERVE_PRELOAD: "true"
      LAYA_SERVE_API_KEY: ${LAYA_API_KEY}

    command:
      - sh
      - -c
      - |
        pip install --no-cache-dir -U "laya[serve]"
        laya-serve
